name: Translate to Japanese

on: [push, workflow_dispatch]

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Google Translate CLI
        run: |
          sudo apt update
          sudo apt install translate-shell

      - name: Translate all Markdown and YAML files
        run: |
          find . -type f \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) -exec bash -c 'cat "$1" | trans -b :ja > "${1%.md}.ja.md"' _ {} \;

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Added Japanese translations"
          git push
