name: Translate to Japanese

on: [push, workflow_dispatch]

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Google Translate CLI (`translate-shell`)
        run: |
          sudo apt update
          sudo apt install -y translate-shell

      - name: Verify `translate-shell` Installation
        run: |
          trans -V

      - name: Translate Markdown and YAML Files
        run: |
          mkdir -p translated  # Create folder for translated files

          # Retry function to handle connection timeouts
          translate_file() {
            local file=$1
            local translated_file="translated/${file%.md}.ja.md"
            local retries=5
            local count=0
            local success=false

            while [ $count -lt $retries ]; do
              if trans -b :ja < "$file" > "$translated_file"; then
                success=true
                break
              fi
              count=$((count + 1))
              echo "Retrying translation ($count/$retries)..."
              sleep 5
            done

            if [ "$success" = false ]; then
              echo "Translation failed for $file after $retries attempts."
            fi
          }

          export -f translate_file
          
          # Find all markdown and YAML files and translate them
          find . -type f \( -name "*.md" -o -name "*.yml" \) | while read file; do
            translate_file "$file"
          done

      - name: Commit and Push Translations
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add .
          git commit -m "Added Japanese translations using `translate-shell`" || echo "No changes to commit"
          git push origin main || echo "Push failed, retrying..." && sleep 5 && git push origin main
